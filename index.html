<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Практична робота № 2 — Пошук матеріалів в Інтернеті та їх оцінювання</title>
<style>
:root{--bg:#f6f2e9;--card:#ffffff;--ink:#1b2540;--muted:#5a6482;--line:#ddd6c6;--accent:#2f5fd0;--accent-ink:#ffffff;--soft:#e3ebfb;--ok:#1d6b3a;--okbg:#dff3e6;--bad:#9b2c2c;--badbg:#fde4e1;--warn:#fde8cf;--input:#fbf9f4}
@media (prefers-color-scheme:dark){:root{--bg:#121a2f;--card:#1c2745;--ink:#f1eee6;--muted:#aab3cc;--line:#37436b;--soft:#26335c;--ok:#8fe0ac;--okbg:#1c3a2a;--bad:#ffb3aa;--badbg:#4a2326;--warn:#4a3a1f;--input:#16203a}}
body[data-v="A"]{--accent:#4a46c9;--soft:#e8e7fb}
body[data-v="B"]{--accent:#0f7b83;--soft:#d9f1f2}
body[data-v="C"]{--accent:#c25e00;--soft:#fde8cf}
body[data-v="D"]{--accent:#b3265a;--soft:#fbe0ea}
@media (prefers-color-scheme:dark){body[data-v="A"]{--accent:#a7a4ff;--accent-ink:#1b1a52;--soft:#2b2a5e}body[data-v="B"]{--accent:#6fd6dc;--accent-ink:#06383c;--soft:#18444a}body[data-v="C"]{--accent:#ffb067;--accent-ink:#4a2500;--soft:#4a3320}body[data-v="D"]{--accent:#ff9ab9;--accent-ink:#4d0d26;--soft:#4d2237}body:not([data-v]){--accent:#8fb0ff;--accent-ink:#102252}}
*{box-sizing:border-box}
html{scroll-padding-top:90px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito","Segoe UI",Arial,sans-serif;font-size:18px;line-height:1.5;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
main{max-width:920px;margin:0 auto;padding:16px 16px 80px}
h1,h2,h3{font-family:"Rubik","Segoe UI",Arial,sans-serif;line-height:1.2;margin:0}
.hero{background:linear-gradient(135deg,var(--accent),#1b2540);color:#fff;border-radius:24px;padding:28px;margin:8px 0 20px}
.hero h1{font-size:30px;margin-bottom:6px}
.hero p{margin:4px 0;opacity:.95}
.badge{display:inline-block;background:rgba(255,255,255,.2);border-radius:99px;padding:2px 14px;font-weight:700;font-size:15px;margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;margin:0 0 18px}
.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.top .who{font-weight:700}
.timer{font-family:"Rubik",Arial,sans-serif;font-size:24px;font-weight:700;min-width:84px;text-align:center;background:var(--soft);border-radius:12px;padding:2px 12px}
.timer.late{background:var(--badbg);color:var(--bad)}
.bar{flex:1;min-width:140px;height:12px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.small{font-size:15px;color:var(--muted)}
.tag{display:inline-block;background:var(--soft);color:var(--ink);font-weight:700;font-size:14px;padding:2px 12px;border-radius:99px;margin-right:6px}
.tcard h2{font-size:22px;margin:6px 0 6px}
.tcard .ico{font-size:26px;margin-right:6px}
.tcard.done{border-color:var(--accent);box-shadow:0 0 0 2px var(--soft)}
label.f{display:block;margin:12px 0}
label.f>span{display:block;font-weight:700;margin-bottom:4px}
input[type=text],input[type=url],textarea,select{font:inherit;width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--input);color:var(--ink)}
textarea{min-height:84px;resize:vertical}
fieldset{border:1px solid var(--line);border-radius:12px;margin:12px 0;padding:8px 12px}
legend{font-weight:700;padding:0 6px}
label.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:12px;margin:6px 0;cursor:pointer}
label.opt input{width:20px;height:20px;margin-top:3px;flex:none;accent-color:var(--accent)}
.it{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.it>p{margin:0 0 6px;font-weight:700}
.it.ok{background:var(--okbg);border-color:var(--ok)}
.it.bad{background:var(--badbg);border-color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:99px;padding:6px 14px;cursor:pointer;background:var(--card)}
.chips input{accent-color:var(--accent)}
.fb{font-size:16px;margin:6px 0 0;font-weight:600}
.it.ok .fb{color:var(--ok)}.it.bad .fb{color:var(--bad)}
button{font:inherit;font-weight:700;background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:10px 20px;cursor:pointer;margin:8px 8px 0 0}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.5;cursor:default}
.res{margin-top:10px;font-weight:700}
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.vcard{border:2px solid var(--line);border-radius:18px;padding:16px;cursor:pointer;background:var(--card);text-align:left;color:var(--ink);font-weight:400;margin:0;display:block;width:100%}
.vcard b{font-family:"Rubik",Arial,sans-serif;font-size:20px;display:block;margin:4px 0}
.vcard.sel{border-color:var(--accent);background:var(--soft)}
.vcard .e{font-size:34px}
.warn{background:var(--warn);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-weight:600}
.story{background:var(--soft);border-radius:16px;padding:14px 18px;margin:0 0 18px}
textarea.out{min-height:160px;font-size:15px;font-family:Consolas,monospace}
@media print{.top button,.noprint,button{display:none!important}.top{position:static}body{background:#fff;color:#000}.card{break-inside:avoid}}
</style>
</head>

/* ===== evaluation ===== */
function norm(s){return String(s==null?'':s).toLowerCase().replace(/[\s\u00a0.,]/g,'')}
function ak(t,i){return t.id+'.'+i}
function fk(t,i){return t.id+'.f'+i}
function itemOk(t,it,i){var v=state.a[ak(t,i)];
 if(it.input)return it.accept.some(function(r){return r.test(norm(v))});
 if(t.type==='pick')return v===it.ans;
 if(v==null)return false;
 var arr=Array.isArray(v)?v.slice().sort():[v];var want=it.ans.slice().sort();
 return arr.length===want.length&&arr.every(function(x,j){return x===want[j]})}
function itemAnswered(t,it,i){var v=state.a[ak(t,i)];return it.input?norm(v)!=='':(Array.isArray(v)?v.length>0:v!=null)}
function fieldOk(f,v){if(f.k==='checks')return true;if(v==null)return false;v=String(v).trim();
 if(f.k==='url')return /^https?:\/\/\S+\.\S+/i.test(v);if(f.k==='select')return v!=='';return v.length>=(f.min||1)}
function fieldsDone(t){var fs=t.fields||[];return fs.every(function(f,i){return fieldOk(f,state.a[fk(t,i)])})}
function fieldsFilled(t){var fs=t.fields||[];return fs.filter(function(f,i){return fieldOk(f,state.a[fk(t,i)])}).length}
function autoScore(t){if(!t.items)return {sc:0,max:0};var sc=0;t.items.forEach(function(it,i){if(itemOk(t,it,i))sc++});return {sc:sc,max:t.items.length}}
function taskDone(t){var auto=!!t.items;var ok=true;if(auto)ok=(state.c[t.id]||0)>0;if(t.fields)ok=ok&&fieldsDone(t);return ok}

/* ===== render ===== */
function fieldHtml(t,f,i){var key=fk(t,i),v=state.a[key];
 if(f.k==='input')return '<label class="f"><span>'+esc(f.l)+'</span><input type="text" data-k="'+key+'" value="'+esc(v)+'"></label>';
 if(f.k==='url')return '<label class="f"><span>'+esc(f.l)+'</span><input type="url" placeholder="https://…" data-k="'+key+'" value="'+esc(v)+'"></label>';
 if(f.k==='area')return '<label class="f"><span>'+esc(f.l)+'</span><textarea data-k="'+key+'">'+esc(v)+'</textarea></label>';
 if(f.k==='select')return '<label class="f"><span>'+esc(f.l)+'</span><select data-k="'+key+'"><option value="">— обери —</option>'+f.o.map(function(o){return '<option'+(v===o?' selected':'')+'>'+esc(o)+'</option>'}).join('')+'</select></label>';
 var arr=Array.isArray(v)?v:[];
 return '<fieldset><legend>'+esc(f.l)+'</legend>'+f.o.map(function(o,j){return '<label class="opt"><input type="checkbox" data-k="'+key+'" data-opt="'+j+'"'+(arr.indexOf(j)>-1?' checked':'')+'> <span>'+esc(o)+'</span></label>'}).join('')+'</fieldset>'}
function itemHtml(t,it,i){var key=ak(t,i),v=state.a[key],att=state.c[t.id]||0,cls='',fb='';
 if(att>0){var ok=itemOk(t,it,i),an=itemAnswered(t,it,i);cls=ok?' ok':(an?' bad':' bad');
  fb=ok?'✓ Правильно. '+esc(it.why):(!an?'Відповідь не обрано.':(att>=2?'✗ '+esc(it.why):'✗ Подумай ще раз і перевір.'))}
 var body='';
 if(it.input)body='<input type="text" inputmode="numeric" placeholder="'+esc(it.ph||'')+'" data-k="'+key+'" value="'+esc(v)+'">';
 else if(t.type==='pick')body='<div class="chips">'+t.labels.map(function(l,j){return '<label><input type="radio" name="'+key+'" data-k="'+key+'" value="'+j+'"'+(v===j?' checked':'')+'> '+esc(l)+'</label>'}).join('')+'</div>';
 else{var multi=!!it.multi;body=it.opts.map(function(o,j){var chk=multi?(Array.isArray(v)&&v.indexOf(j)>-1):v===j;
  return '<label class="opt"><input type="'+(multi?'checkbox':'radio')+'" name="'+key+'" data-k="'+key+'" data-opt="'+j+'" value="'+j+'"'+(chk?' checked':'')+'> <span>'+esc(o)+'</span></label>'}).join('')}
 return '<div class="it'+cls+'"><p>'+(i+1)+'. '+esc(it.q)+'</p>'+body+(fb?'<p class="fb">'+fb+'</p>':'')+'</div>'}
function taskHtml(t){var h='<section class="card tcard'+(taskDone(t)?' done':'')+'" id="t_'+t.id+'" data-t="'+t.id+'">';
 h+='<span class="tag">⏱ ~'+t.min+' хв</span><span class="tag">'+(t.items?'Автоперевірка':'Оцінює вчитель'+(t.pts?' · до '+t.pts+' б.':''))+'</span>';
 h+='<h2><span class="ico">'+t.ico+'</span>'+esc(t.title)+'</h2>';
 if(t.desc)h+='<p class="small">'+t.desc+'</p>';
 if(t.items){h+=t.items.map(function(it,i){return itemHtml(t,it,i)}).join('');
  h+='<button data-act="check" data-t="'+t.id+'">Перевірити</button>';
  var att=state.c[t.id]||0;if(att>0){var r=autoScore(t);h+='<span class="res">Результат: '+r.sc+' з '+r.max+(r.sc<r.max?' — можна виправити й перевірити ще раз':' 🎉')+'</span>'}}
 if(t.fields)h+=t.fields.map(function(f,i){return fieldHtml(t,f,i)}).join('')+'<p class="small chip" data-chip="'+t.id+'">Заповнено: '+fieldsFilled(t)+' з '+t.fields.length+'</p>';
 return h+'</section>'}

function render(){document.body.removeAttribute('data-v');
 var app=$('#app');
 if(!state.v||!VARIANTS[state.v]){app.innerHTML=startHtml();return}
 document.body.setAttribute('data-v',state.v);
 var V=VARIANTS[state.v];
 var h='<div class="top"><div class="who">'+esc(state.name)+' · '+esc(state.cls||'')+' · варіант '+state.v+'</div><div class="timer" id="timer">45:00</div><div class="bar"><i id="barfill"></i></div><div class="small" id="prog"></div></div><main>';
 if(!storageOk)h+='<div class="warn">⚠️ Браузер не дозволяє зберігати дані. Не закривай і не оновлюй сторінку, а наприкінці скопіюй результат.</div>';
 h+='<div class="hero"><span class="badge">Практична робота № 2 · '+V.e+' варіант '+state.v+'</span><h1>'+esc(V.name)+'</h1><p>Пошук матеріалів в Інтернеті та їх оцінювання</p></div>';
 h+='<div class="story">'+V.story+'</div>';
 h+='<p class="small noprint">Відповіді зберігаються автоматично. Кожен сайт відкривай у новій вкладці (Ctrl + T), на рекламу не натискай, нічого не завантажуй.</p>';
 h+=V.tasks.map(taskHtml).join('');
 h+='<section class="card" id="result"></section></main>';
 app.innerHTML=h;renderResult();tick();updateProgress()}

function startHtml(){var sel=state.pick||(new URLSearchParams(location.search).get('v')||'').toUpperCase();if(!VARIANTS[sel])sel='';
 var h='<main><div class="hero"><span class="badge">5 клас · Інформатика</span><h1>Практична робота № 2</h1><p>Пошук матеріалів в Інтернеті та їх оцінювання</p><p class="small" style="color:#fff">На виконання — 45 хвилин. Відповіді зберігаються автоматично.</p></div>';
 if(!storageOk)h+='<div class="warn">⚠️ Браузер не дозволяє зберігати дані: після оновлення сторінки відповіді буде втрачено.</div>';
 h+='<div class="card"><label class="f"><span>Прізвище та ім’я</span><input type="text" id="nm" value="'+esc(state.name)+'"></label><label class="f"><span>Клас</span><input type="text" id="cl" value="'+esc(state.cls)+'" placeholder="наприклад, 5-А"></label></div>';
 h+='<h2 style="margin:6px 0 12px">Обери варіант</h2><div class="vgrid">'+Object.keys(VARIANTS).map(function(k){var V=VARIANTS[k];return '<button class="vcard'+(sel===k?' sel':'')+'" data-act="pick" data-v="'+k+'"><span class="e">'+V.e+'</span><b>Варіант '+k+'. '+esc(V.name)+'</b><span class="small">'+esc(V.desc)+'</span></button>'}).join('')+'</div>';
 h+='<p><button data-act="random" class="ghost">🎲 Випадковий варіант</button><button data-act="start">Почати роботу</button></p><p class="small" id="serr"></p></main>';return h}

function renderResult(){var el=$('#result');if(!el)return;var V=VARIANTS[state.v],sc=0,max=0,done=0,n=V.tasks.length;
 V.tasks.forEach(function(t){var r=autoScore(t);if((state.c[t.id]||0)>0)sc+=r.sc;max+=r.max;if(taskDone(t))done++});
 var el2=elapsed();
 var h='<h2>🏆 Результат</h2><p>Автоперевірка: <b>'+sc+' з '+max+'</b> балів. Завдань виконано: <b>'+done+' з '+n+'</b>. Час: <b>'+fmt(el2)+'</b>.</p><p class="small">Завдання без автоперевірки оцінює вчитель за твоїми відповідями.</p>';
 if(!state.fin)h+='<button data-act="fin">Завершити роботу</button>';else h+='<p class="res">✅ Роботу завершено. Скопіюй результат і покажи вчителю.</p>';
 h+='<button class="ghost" data-act="copy">Показати результат для копіювання</button><button class="ghost" data-act="print">Друк / PDF</button><button class="ghost" data-act="reset">Почати спочатку</button><div id="outwrap"></div>';el.innerHTML=h}

function resultText(){var V=VARIANTS[state.v],L=[];var sc=0,max=0;
 V.tasks.forEach(function(t){var r=autoScore(t);if((state.c[t.id]||0)>0)sc+=r.sc;max+=r.max});
 L.push('Практична робота № 2. 5 клас');L.push('Учень: '+state.name+', '+(state.cls||'—'));L.push('Варіант '+state.v+': '+V.name);L.push('Час: '+fmt(elapsed())+'. Автоперевірка: '+sc+' з '+max);L.push('');
 V.tasks.forEach(function(t){L.push('— '+t.title+(t.items?' ['+autoScore(t).sc+'/'+autoScore(t).max+(state.c[t.id]?'':', не перевірено')+']':''));
  if(t.fields)t.fields.forEach(function(f,i){var v=state.a[fk(t,i)];if(f.k==='checks')v=(Array.isArray(v)?v:[]).map(function(j){return f.o[j]}).join('; ');L.push('   '+f.l+': '+(v||'—'))})});
 return L.join('\n')}

/* ===== timer & progress ===== */
function elapsed(){if(!state.t0)return 0;return Math.max(0,Math.floor(((state.fin||Date.now())-state.t0)/1000))}
function fmt(s){var m=Math.floor(s/60),r=s%60;return m+' хв '+(r<10?'0':'')+r+' с'}
function tick(){var el=$('#timer');if(!el)return;var left=TOTAL_MIN*60-elapsed(),late=left<0,a=Math.abs(left);
 el.textContent=(late?'+':'')+Math.floor(a/60)+':'+(a%60<10?'0':'')+(a%60);el.className='timer'+(late?' late':'')}
setInterval(tick,1000);
function updateProgress(){if(!state.v)return;var V=VARIANTS[state.v],d=0;V.tasks.forEach(function(t){if(taskDone(t))d++});
 var f=$('#barfill'),p=$('#prog');if(f)f.style.width=Math.round(d/V.tasks.length*100)+'%';if(p)p.textContent=d+' з '+V.tasks.length+' завдань'}
function refreshCard(id){var t=VARIANTS[state.v].tasks.filter(function(x){return x.id===id})[0],el=$('#t_'+id);if(el){var tmp=document.createElement('div');tmp.innerHTML=taskHtml(t);el.replaceWith(tmp.firstChild)}}

/* ===== events ===== */
document.addEventListener('input',onChange);document.addEventListener('change',onChange);
function onChange(e){var el=e.target,k=el&&el.dataset&&el.dataset.k;if(!k)return;
 if(state.v===undefined||state.v==null)return;
 if(el.type==='checkbox'){var arr=Array.isArray(state.a[k])?state.a[k].slice():[];var j=Number(el.dataset.opt);var ix=arr.indexOf(j);if(el.checked&&ix<0)arr.push(j);if(!el.checked&&ix>-1)arr.splice(ix,1);state.a[k]=arr}
 else if(el.type==='radio')state.a[k]=Number(el.value);
 else state.a[k]=el.value;
 save();updateProgress();var card=el.closest('.tcard');
 if(card){var id=card.dataset.t,t=VARIANTS[state.v].tasks.filter(function(x){return x.id===id})[0];var chip=card.querySelector('.chip');if(chip&&t.fields)chip.textContent='Заповнено: '+fieldsFilled(t)+' з '+t.fields.length;card.classList.toggle('done',taskDone(t));}
 renderResult()}
document.addEventListener('input',function(e){var id=e.target.id;if(id==='nm'){state.name=e.target.value;save()}if(id==='cl'){state.cls=e.target.value;save()}});
document.addEventListener('click',function(e){var b=e.target.closest('[data-act]');if(!b)return;var act=b.dataset.act;
 if(act==='pick'){state.pick=b.dataset.v;save();document.querySelectorAll('.vcard').forEach(function(x){x.classList.toggle('sel',x===b)});return}
 if(act==='random'){var ks=Object.keys(VARIANTS);state.pick=ks[Math.floor(Math.random()*ks.length)];save();render();return}
 if(act==='start'){var sel=state.pick||(new URLSearchParams(location.search).get('v')||'').toUpperCase();
